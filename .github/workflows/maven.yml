# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven
    - name: Test with Maven
      run: ./mvnw --batch-mode test

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  snyk-security-scan:
    needs: docker-build-test
    name: Snyk dependency scan
    # Repository secrets are unavailable to fork and Dependabot pull requests.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven

    # Install the CLI on the runner so it uses the configured JDK 23.
    - name: Set up Snyk
      uses: snyk/actions/setup@master

    - name: Scan dependencies with Snyk
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        if [ -z "$SNYK_TOKEN" ]; then
          echo "::error::Add SNYK_TOKEN under repository Settings > Secrets and variables > Actions."
          exit 1
        fi
        snyk test --file=pom.xml --severity-threshold=high

  telegram-notification:
    name: Telegram notification
    needs: snyk-security-scan
    # Report failed scans too, but do not notify when the scan was skipped or cancelled.
    if: >-
      always() &&
      (needs.snyk-security-scan.result == 'success' ||
       needs.snyk-security-scan.result == 'failure')
    runs-on: ubuntu-latest
    permissions: {}

    steps:
    - name: Send Snyk result to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SCAN_RESULT: ${{ needs.snyk-security-scan.result }}
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "::error::Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as repository Actions secrets."
          exit 1
        fi

        printf -v message '%s\n' \
          "Snyk security scan: $SCAN_RESULT" \
          "Repository: $GITHUB_REPOSITORY" \
          "Ref: $GITHUB_REF_NAME" \
          "Commit: $GITHUB_SHA" \
          "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

        curl --fail --silent --show-error --max-time 30 \
          --request POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
          --data-urlencode "text=$message" \
          | jq --exit-status '.ok == true' > /dev/null

  docker-build:
    name: Build Docker image
    needs: docker-build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build --tag "d13revision:${GITHUB_SHA}" .

    - name: Export Docker image
      run: docker save --output "$RUNNER_TEMP/d13revision.tar" "d13revision:${GITHUB_SHA}"

    - name: Upload Docker image for scanning
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: ${{ runner.temp }}/d13revision.tar
        retention-days: 1
        compression-level: 0

  container-scanning:
    name: Trivy container scan
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: ${{ runner.temp }}/docker-image

    - name: Scan all container vulnerabilities
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        # Capture every finding before applying CVE and GHSA suppressions.
        TRIVY_IGNOREFILE: /dev/null
      with:
        scan-type: image
        input: ${{ runner.temp }}/docker-image/d13revision.tar
        scanners: vuln
        format: json
        output: trivy-results.json
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        ignore-unfixed: false
        exit-code: '0'
        timeout: 10m

    - name: Add all detected CVE and GHSA IDs to .trivyignore
      run: |
        touch .trivyignore
        jq --raw-output \
          '[.Results[]?.Vulnerabilities[]?.VulnerabilityID | select(test("^(CVE-[0-9]{4}-[0-9]+|GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4})$"))] | unique[]' \
          trivy-results.json > detected-vulnerability-ids.txt
        awk '!seen[$0]++' .trivyignore detected-vulnerability-ids.txt > "$RUNNER_TEMP/trivyignore"
        mv "$RUNNER_TEMP/trivyignore" .trivyignore

    - name: Scan with vulnerability ignore list
      run: |
        trivy image \
          --input "$RUNNER_TEMP/docker-image/d13revision.tar" \
          --scanners vuln \
          --ignorefile .trivyignore \
          --format table \
          --exit-code 1 \
          --timeout 10m

    - name: Upload Trivy report and vulnerability ignore list
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-results
        include-hidden-files: true
        path: |
          trivy-results.json
          .trivyignore
        retention-days: 7
